name: Extract InspectAI Redesign

on:
  push:
    paths:
      - 'inspectai-ui-redesign.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -lh inspectai-ui-redesign.zip
          unzip -l inspectai-ui-redesign.zip | head -30

      - name: Extract redesign
        run: |
          mkdir -p /tmp/inspectai
          unzip -q -o inspectai-ui-redesign.zip -d /tmp/inspectai

          ROOT=$(find /tmp/inspectai -name package.json -print -quit | xargs dirname)

          echo "Project root: $ROOT"

          cp -R "$ROOT"/. .

      - name: Commit redesigned project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Apply InspectAI UI redesign" || exit 0

          git push
