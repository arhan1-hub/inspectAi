name: InspectAI Redesign Extractor
on:
  push:
    paths:
      - 'inspectai-ui-redesign.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract redesign
        run: |
          rm -rf /tmp/inspectai
          mkdir -p /tmp/inspectai

          echo "Checking ZIP..."
          ls -lh inspectai-ui-redesign.zip

          unzip -q -o inspectai-ui-redesign.zip -d /tmp/inspectai

          ROOT=$(find /tmp/inspectai -name package.json -print -quit | xargs dirname)

          echo "Project root: $ROOT"

          if [ -z "$ROOT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT/" ./

      - name: Commit redesigned project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Apply InspectAI UI redesign" || echo "No changes to commit"

          git push
